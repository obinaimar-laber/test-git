<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Desain Tombol Game 1 (Lompat Bola) */
        .btn-game1 {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }
        /* Desain Tombol Game 2 (Tangkap Warna) */
        .btn-game2 {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        .game-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .game-link:active {
            transform: translateY(-1px);
        }
        .emoji {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Mini Game Home</h1>
        <p>choose your game bro :v</p>
        
        <div class="menu-list">
            <!-- Hyperlink ke Game 1 -->
            <a href="ball.html" class="game-link btn-game1">
                <span>🔵 ball jumper</span>
                <span class="emoji">➔</span>
            </a>
            
            <!-- Hyperlink ke Game 2 -->
            <a href="catchcolor.html" class="game-link btn-game2">
                <span>📦 Tangkap Balok Warna</span>
                <span class="emoji">➔</span>
            </a>
        </div>
    </div>

</body>
</html>
